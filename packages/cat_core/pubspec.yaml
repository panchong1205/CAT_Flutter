name: cat_core
description: Core infrastructure for CAT app - DI, routing, config, network, storage, logging
version: 0.0.1
publish_to: none

environment:
  sdk: ^3.11.0
  flutter: '>=3.41.0'

dependencies:
  flutter:
    sdk: flutter
  cat_design_system:
    path: ../cat_design_system
  cat_domain:
    path: ../cat_domain
  cat_data:
    path: ../cat_data
  flutter_riverpod: ^2.5.0
  riverpod_annotation: ^2.3.0
  go_router: ^14.0.0
  get_it: ^7.6.0
  injectable: ^2.4.0
  dio: ^5.4.0
  drift: ^2.16.0
  sqlite3_flutter_libs: ^0.5.0
  web_socket_channel: ^2.4.0
  freezed_annotation: ^2.4.0
  connectivity_plus: ^6.0.0
  json_annotation: ^4.8.0
  flutter_map: ^7.0.0
  latlong2: ^0.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.0
  freezed: ^2.4.0
  injectable_generator: ^2.6.0
  drift_dev: ^2.16.0
  mocktail: ^1.0.0